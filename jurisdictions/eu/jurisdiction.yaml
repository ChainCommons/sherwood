notes: >-
  Dependency pack for France, not an EU tax pack and not a member state. Five
  instruments are indexed (MiCA, the VAT Directive, the 2022 VAT-rates
  amendment, DAC8, CJEU Hedqvist) so national packs can reference them instead
  of duplicating them, and seven rules model the narrow set those instruments
  support: the taxable-person scope gate, the three place-of-supply rules,
  Hedqvist, the absence of any EU authority on NFTs, and that DAC8 reporting
  changes no treatment. Two domains move to supported because a sourced rule
  now decides something in them. Supported does not mean answered: the pack
  says where a supply is located and whether VAT reaches it, never at what rate
  or how much, and direct taxation is a Member State competence with no EU
  layer to model at all. The modelled window opens 2019-01-01 because the
  place-of-supply articles reached their current form through amending
  instruments not indexed here. Review status stays COMMUNITY_DRAFT: no rule is
  SOURCE_VERIFIED and no EU-qualified reviewer is recorded. See RESEARCH.md,
  unsupported.yaml, rules/README.md and tests/README.md.
