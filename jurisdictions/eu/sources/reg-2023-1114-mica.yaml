notes: >-
  redistribution: extract. Not a tax instrument, but France now defines its tax
  perimeter by reference to it: CGI art. 150 VH bis (from 2026-06-28) covers
  crypto-assets in scope of MiCA, and CGI art. 150 VH ter covers the unique,
  non-fungible ones art. 2(3) excludes. Recitals treat issuance in a large
  series or collection as an indicator of fungibility, so "it is an NFT" is not
  by itself a classification — this is a facts question, not a rule.
