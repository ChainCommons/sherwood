notes: >-
  redistribution: extract. Exchanging a traditional currency for bitcoin and
  back is a supply of services exempt under the currency limb of art. 135(1)(e)
  of the VAT Directive. It is about a fungible payment token exchanged for
  currency. It does NOT decide the VAT treatment of an NFT, a mint, or a
  royalty stream, and the 2024 French rescrit expressly puts NFTs outside the
  financial-operations exemption.
