notes: >-
  redistribution: extract. The perimeter is now MiCA's, and MiCA art. 2(3)
  excludes unique, non-fungible crypto-assets — which CGI art. 150 VH ter picks
  up. The 305 € annual disposal-proceeds exemption and the exclusion of
  exchanges without soulte both survive. Légifrance attributes a version taking
  effect 2026-07-01 to the ordonnance n° 2024-936 du 15 octobre 2024, art. 26;
  the relationship between that consolidation and the 2026-06-28 wording was NOT
  resolved and is an open item in RESEARCH.md. No content_hash (Légifrance
  returns 403 to automated requests).
