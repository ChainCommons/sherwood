permitted_extract: >-
  « Sous réserve des dispositions propres aux bénéfices professionnels, les
  plus-values réalisées par les personnes physiques domiciliées fiscalement en
  France au sens de l'article 4 B, directement ou par personne interposée, lors
  d'une cession à titre onéreux d'actifs numériques mentionnés à l'article L.
  54-10-1 du code monétaire et financier ou de droits s'y rapportant sont
  passibles de l'impôt sur le revenu dans les conditions prévues au présent
  article. »
