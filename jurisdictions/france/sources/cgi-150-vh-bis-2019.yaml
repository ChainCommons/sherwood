notes: >-
  redistribution: extract. THIS is the version an as-of query for 2019–2025 must
  return. It defines its perimeter by reference to art. L. 54-10-1 of the code
  monétaire et financier, which says nothing about fungibility — so whether an
  NFT fell inside it in 2021 is UNSETTLED, not settled either way. canonical_url
  is pinned to 2021-06-30 so the link resolves to this wording rather than the
  current one. Légifrance answers automated requests with HTTP 403, so no
  content_hash is recorded — see RESEARCH.md. The Légifrance consolidation
  window opens on 2019-05-24 (a later amendment) while the regime itself governs
  disposals from 2019-01-01; effective_from records the regime.
