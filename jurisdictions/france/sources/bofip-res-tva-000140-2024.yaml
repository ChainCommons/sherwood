notes: >-
  redistribution: extract. THE dated boundary for NFT VAT in France, and the
  single most important date in this pack. Published 2024-02-14: nothing in it
  was available to a 2021, 2022 or 2023 taxpayer, and the pack MUST NOT let it
  answer an as-of query for those years. It looks through the token to the
  underlying good or service, and states that a JNF is not a payment, utility or
  investment token, so NFT operations fall outside the financial exemption of
  CGI art. 261 C. No earlier NFT VAT doctrine was found, which is why there is
  no `supersedes` here — the absence is the finding.
