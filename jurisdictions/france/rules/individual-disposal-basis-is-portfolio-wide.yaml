# Plan 15: "Cost-basis method is user/jurisdiction-selected, not hardcoded
# FIFO." For France the stronger statement is available and sourced: there is
# no lot method at all.
#
# BOI-RPPM-PVBMC-30-20 computes the gain from the total acquisition price of
# the whole portfolio, scaled by the disposal price over the portfolio's global
# value at the moment of disposal. There are no lots and no ordering to choose.
# FIFO, LIFO, HIFO and average cost are all wrong here, not approximate.
#
# This rule ships as a prohibition rather than a computation. Expressing the
# formula exactly needs a portfolio-global-value input the pack cannot yet
# describe, so the honest move is to name the formula, refuse every lot method,
# and let the caller stop.
$schema: https://schemas.opencryptotaxcommons.org/rule/rule.schema.json
rule_id: fr-individual-disposal-basis-is-portfolio-wide
jurisdiction_id: france
tax_domain: tax_lot_accounting
title: >-
  The art. 150 VH bis base is portfolio-wide; no tax-lot method applies
applies_to:
  capacities:
    - COLLECTOR
    - PRIVATE_INVESTOR
  event_types:
    - CRYPTO_SALE
    - ASSET_SALE
dsl_version: '0'
conditions:
  all:
    - field: asset_category
      op: eq
      value: fungible_digital_asset
    - field: jurisdiction_facts.french_tax_resident
      op: eq
      value: true
    - field: jurisdiction_facts.annual_disposal_proceeds_over_305_eur
      op: eq
      value: true
effects:
  tax_base_rule: fr-150-vh-bis-portfolio-formula
  calculation_rule: NO_LOT_METHOD_APPLIES
effective_from: '2019-01-01'
effective_to: '2026-06-27'
published_from: '2019-09-02'
sources:
  - fr-cgi-150-vh-bis-2019
  - fr-bofip-rppm-pvbmc-30-20-2019
authority_status: ADMINISTRATIVE_GUIDANCE
certainty:
  level: AUTHORITATIVE_INTERPRETIVE
  reason: >-
    BOI-RPPM-PVBMC-30-20 states the computation in portfolio terms. That it
    excludes lot methods follows by construction rather than by an express
    prohibition, since no French source discusses FIFO in order to reject it.
review:
  status: COMMUNITY_DRAFT
  scope: >-
    Authored against the indexed sources only. No qualified French reviewer is
    recorded for this pack (P0-L-01).
test_cases:
  - fr-t-disposal-above-floor-2021
  - fr-t-basis-no-lot-method-2021
  - fr-t-disposal-below-floor-2021
  - fr-t-floor-305-eur-and-one-cent-2021
  - fr-t-floor-missing-proceeds-fact-2021
  - fr-t-disposal-missing-residence-fact-2021
  - fr-t-disposal-active-trader-not-covered-2021
  - fr-t-disposal-nft-not-covered-2021
  - fr-t-disposal-2026-after-recast-not-modelled
  - fr-t-disposal-2019-before-bofip-published
notes: >-
  fr-150-vh-bis-portfolio-formula is a name, not an implementation: nothing in
  P0 computes it, and a consumer that cannot resolve the name MUST stop rather
  than fall back to a lot method. published_from is 2019-09-02, the BOFiP date,
  not the statute date: the formula is doctrine, and a taxpayer disposing in
  the first eight months of 2019 could not read it.
schema_version: 0.1.0
