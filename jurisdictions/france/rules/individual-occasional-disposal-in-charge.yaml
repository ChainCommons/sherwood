# The best-sourced determination in the pack: an occasional disposal of a
# fungible digital asset by a French-resident individual, for consideration,
# above the annual floor, is inside art. 150 VH bis.
#
# What this rule does NOT do is compute anything. tax_base_rule names the
# portfolio-wide formula of BOI-RPPM-PVBMC-30-20; it is a name, not an
# implementation, and fr-individual-disposal-basis-is-portfolio-wide exists to
# stop a caller substituting a lot method for it.
$schema: https://schemas.opencryptotaxcommons.org/rule/rule.schema.json
rule_id: fr-individual-occasional-disposal-in-charge
jurisdiction_id: france
tax_domain: capital_gains
title: >-
  Occasional disposal of fungible digital assets by a French-resident
  individual is charged under art. 150 VH bis
applies_to:
  capacities:
    - COLLECTOR
    - PRIVATE_INVESTOR
  event_types:
    - CRYPTO_SALE
    - ASSET_SALE
dsl_version: '0'
conditions:
  all:
    - field: asset_category
      op: eq
      value: fungible_digital_asset
    - field: jurisdiction_facts.french_tax_resident
      op: eq
      value: true
    - field: jurisdiction_facts.annual_disposal_proceeds_over_305_eur
      op: eq
      value: true
effects:
  classification: TAXABLE_DISPOSAL
  tax_base_rule: fr-150-vh-bis-portfolio-formula
effective_from: '2019-01-01'
effective_to: '2026-06-27'
published_from: '2018-12-28'
sources:
  - fr-cgi-150-vh-bis-2019
  - fr-bofip-rppm-pvbmc-30-10-2019
  - fr-bofip-rppm-pvbmc-30-20-2019
  - fr-cgi-200-c
authority_status: BINDING_LEGISLATION
certainty:
  level: AUTHORITATIVE_CLEAR
  reason: >-
    Art. 150 VH bis charges occasional disposals of digital assets by
    individuals domiciled in France within the meaning of art. 4 B, and
    BOI-RPPM-PVBMC-30-10 sets out the scope.
review:
  status: COMMUNITY_DRAFT
  scope: >-
    Authored against the indexed sources only. No qualified French reviewer is
    recorded for this pack (P0-L-01).
test_cases:
  - fr-t-disposal-above-floor-2021
  - fr-t-basis-no-lot-method-2021
  - fr-t-disposal-below-floor-2021
  - fr-t-floor-305-eur-and-one-cent-2021
  - fr-t-floor-missing-proceeds-fact-2021
  - fr-t-disposal-missing-residence-fact-2021
  - fr-t-disposal-active-trader-not-covered-2021
  - fr-t-disposal-nft-not-covered-2021
  - fr-t-disposal-2026-after-recast-not-modelled
  - fr-t-disposal-2019-before-bofip-published
notes: >-
  No rate is asserted. CGI art. 200 C sets 12,8 %; the 17,2 % prélèvements
  sociaux are levied under the code de la sécurité sociale, which this pack has
  not indexed (RESEARCH.md §6), so no combined rate exists here to state. The
  option for the barème progressif (disposals from 2023-01-01) is not modelled
  either: the statute is indexed but the doctrine explaining the option only
  appeared on 2024-04-23. Capacity is required and never inferred: a
  participant whose capacity is ACTIVE_TRADER or PROFESSIONAL_TRADER falls
  outside this rule and the pack has nothing sourced to put in its place.
schema_version: 0.1.0
