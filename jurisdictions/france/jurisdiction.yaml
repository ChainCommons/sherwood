notes: >-
  Sources indexed, no rules modelled. Every tax domain stays unsupported until
  a sourced rule exists, so the UI reports 'not modelled' rather than implying
  that silence means no tax applies. France published no NFT-specific VAT
  guidance before 2024-02-14 and no NFT income-tax provision before CGI art.
  150 VH ter (2026), so an NFT question about an earlier year is UNSETTLED, not
  unanswered by accident. See RESEARCH.md.
