notes: >-
  Sources indexed and explained; no rules modelled. LEVEL 2 records the seven
  human-readable explanations in explanations/, which is a reading of the
  sources, not an executable rule: every tax domain stays unsupported until a
  sourced rule exists (P0-3-03), so the UI reports 'not modelled' rather than
  implying that silence means no tax applies. France published no NFT-specific
  VAT guidance before 2024-02-14 and no NFT income-tax provision before CGI
  art. 150 VH ter (2026), so an NFT question about an earlier year is
  UNSETTLED, not unanswered by accident. See RESEARCH.md and
  explanations/README.md.
