last_source_verification: '2026-09-08'
notes: >-
  LEVEL 3: thirteen machine-readable rules in rules/, two competing
  interpretations, one reporting rule and 52 test cases. Four domains move to
  supported because a sourced rule now decides something in them; the rest stay
  unsupported so the UI reports 'not modelled' rather than implying that
  silence means no tax applies. Supported does not mean answered: five of the
  thirteen rules are UNSETTLED and exist to record what France had not decided,
  and personal_income_tax and professional_business_income stay unsupported
  even though a rule exists in each, because those rules only mark the boundary
  of the question. France published no NFT-specific VAT guidance before
  2024-02-14 and no NFT income-tax provision before CGI art. 150 VH ter (2026),
  so an NFT question about an earlier year is UNSETTLED, not unanswered by
  accident. Review status stays COMMUNITY_DRAFT throughout: no rule is
  SOURCE_VERIFIED or EXPERT_REVIEWED, and no qualified French reviewer is
  recorded (P0-L-01). See RESEARCH.md, rules/README.md and tests/README.md.
schema_version: 0.1.0
