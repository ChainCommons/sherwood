name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pushed update should cancel the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        # Schemas, unique IDs, source references, temporal ranges, knowledge
        # contribution requirements, internal links, secrets, and the
        # engine-purity import invariants (§85).
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  lockfile:
    name: lockfile is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install with a frozen lockfile
        # Fails if package.json and pnpm-lock.yaml disagree, which is how a
        # dependency change sneaks in unreviewed.
        run: pnpm install --frozen-lockfile
